name: Release

on:
  push:
    tags:
      - "v*-rc.*"
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to test, build and publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          SEMVER='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][A-Za-z0-9-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][A-Za-z0-9-]*))*)?(\+[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*)?$'
          [[ "$TAG" =~ $SEMVER ]]
          COMMIT=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  test:
    needs: resolve
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
      - run: go test ./...
      - run: go vet ./...
      - if: runner.os == 'Linux'
        shell: bash
        run: |
          bash -n bootstrap.sh install.sh upgrade.sh tests/bootstrap_test.sh
          bash tests/bootstrap_test.sh
          go test -race ./...
          sudo env "PATH=$PATH" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" GOTOOLCHAIN=local go test -count=1 ./...

  build:
    needs: [resolve, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
      - name: Build and checksum release assets
        shell: bash
        env:
          CGO_ENABLED: '0'
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir dist
          LDFLAGS="-s -w -X github.com/M1saka10010/SwallowAgent/buildinfo.Version=$TAG"
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o dist/swallow-agent-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" -o dist/swallow-agent-linux-arm64 .
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o dist/swallow-agent-windows-amd64.exe .
          cp bootstrap.sh install.sh upgrade.sh dist/
          cd dist
          sha256sum swallow-agent-* bootstrap.sh install.sh upgrade.sh > checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

  release:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tag has not moved
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          COMMIT: ${{ needs.resolve.outputs.commit }}
        run: test "$(git rev-parse --verify "refs/tags/$TAG^{commit}")" = "$COMMIT"
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ (inputs.tag || github.ref_name) == 'v0.1.2' && 'release-notes/v0.1.2.md' || (inputs.tag || github.ref_name) == 'v0.1.1' && 'release-notes/v0.1.1.md' || (inputs.tag || github.ref_name) == 'v0.1.0' && 'release-notes/v0.1.0.md' || '' }}
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ needs.resolve.outputs.commit }}
          name: ${{ inputs.tag || github.ref_name }}
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
